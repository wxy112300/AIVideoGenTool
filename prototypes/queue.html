<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>队列 · Local Video Studio 原型</title>
  <script src="app/boot.js"></script>
  <link rel="stylesheet" href="design-system/tokens.css">
  <link rel="stylesheet" href="design-system/controls.css">
  <link rel="stylesheet" href="design-system/surfaces.css">
  <link rel="stylesheet" href="app/app.css">
  <link rel="stylesheet" href="app/queue.css">
</head>
<body data-page="queue">
  <div class="app-shell">
    <header data-shell></header>
    <main>
      <section class="page-heading sticky queue-heading">
        <div class="page-title">
          <h1>生成队列</h1>
          <div class="status-line">
            <span data-when="run=idle|empty" class="row" style="gap:6px"><span class="dot off"></span>ComfyUI 未启动</span>
            <span data-when="run=starting" class="row" style="gap:6px"><span class="dot busy"></span>ComfyUI 启动中</span>
            <span data-when="run=running|pausing" class="row" style="gap:6px"><span class="dot on"></span>ComfyUI 运行中</span>
            <span class="sep">·</span><span><b data-task-count>5</b> 个任务</span>
            <span data-when="run=running|pausing"><span class="sep">·</span> 已耗时 <b id="run-elapsed">12:34</b></span>
            <span data-when="run=idle|running|pausing" data-tip="按当前进度和历史耗时估算"><span class="sep">·</span> 预计还需 <b>18 分 52 秒</b></span>
          </div>
        </div>
        <span></span>
        <div class="page-actions">
          <label class="switch-row" data-tip="对支持预览的任务显示低分辨率过程画面；实际频率取决于节点回调和编码速度。"><span class="switch-copy"><span>实时预览</span></span><span class="switch"><input type="checkbox" id="live-toggle" checked><span></span></span></label>
          <span class="vdivider"></span>
          <span data-when="run=idle|empty"><button class="btn btn-primary lit" type="button" id="queue-primary"><i data-lucide="play"></i>开始队列</button></span>
          <span data-when="run=starting"><button class="btn btn-primary" type="button" disabled aria-busy="true"><i data-lucide="loader-circle"></i>启动中</button></span>
          <span data-when="run=running"><button class="btn btn-gray lit" type="button" data-proxy="queue-primary" data-tip="本条任务完成后停止后续任务"><i data-lucide="circle-stop"></i>结束队列</button></span>
          <span data-when="run=pausing"><button class="btn btn-primary lit" type="button" data-proxy="queue-primary"><i data-lucide="play"></i>继续队列</button></span>
        </div>
      </section>

      <div class="notice" data-when="run=starting" role="status"><i data-lucide="loader-circle"></i><p>正在启动 ComfyUI，已耗时 00:14；服务就绪后会自动开始队列。</p><span></span></div>
      <div class="notice" data-when="run=pausing" role="status"><i data-lucide="pause"></i><p id="pause-notice-text">正在等待当前任务结束；后续任务会保留在队列中。</p><span></span></div>

      <div class="card perf-strip" aria-label="性能">
        <div><span class="caption"><span>CPU</span></span><strong>12%</strong><div class="progress"><span style="--value:12%"></span></div></div>
        <div><span class="caption"><span>系统内存</span><span class="num">33.0 / 63.8 GB</span></span><strong>52%</strong><div class="progress"><span style="--value:52%"></span></div></div>
        <div class="hot"><span class="caption"><span>GPU</span><span class="num">71°C</span></span><strong>97%</strong><div class="progress"><span style="--value:97%"></span></div></div>
        <div><span class="caption"><span>显存</span><span class="num">18.2 / 24.0 GB</span></span><strong>76%</strong><div class="progress"><span style="--value:76%"></span></div></div>
      </div>

      <section class="card" data-when="run=empty">
        <div class="state"><i data-lucide="list-video"></i><h4>队列还是空的</h4><p>从创建页加入一个任务后，就可以在这里运行。</p><a class="btn btn-gray" href="create.html"><i data-lucide="plus"></i>去创建</a></div>
      </section>

      <section class="q-section" data-when="run=idle|starting|running|pausing">
        <div class="q-section-head"><h2>执行队列</h2><span class="count"><span data-task-count>5</span> 项</span></div>
        <div id="running-slot"></div>
        <div class="q-list" id="q-list"></div>
      </section>

      <section class="q-section" data-when="attention=some">
        <div class="q-section-head"><h2>需要处理</h2><span class="count" data-tip="失败和取消的任务不会自动占用执行队列">2 项</span></div>
        <div class="q-list" id="attention-list"></div>
      </section>
    </main>
  </div>
  <div class="dialog-backdrop" id="remove-dialog" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="remove-title">
      <div class="dialog-head"><span class="dialog-icon danger"><i data-lucide="trash-2"></i></span><div><h3 id="remove-title">移除这个任务？</h3><span class="caption" id="remove-name"></span></div><button class="btn btn-icon btn-sm" type="button" data-close aria-label="关闭"><i data-lucide="x"></i></button></div>
      <p class="meta" id="remove-note"></p>
      <div class="dialog-actions"><button class="btn btn-plain" type="button" data-close data-autofocus>取消</button><span class="spacer"></span><button class="btn btn-destructive-filled btn-destructive" type="button" id="remove-confirm"><i data-lucide="trash-2"></i>移除</button></div>
    </section>
  </div>
  <script id="proto-states" type="application/json">
    {
      "run": { "label": "队列状态", "options": { "running": "运行中", "pausing": "本条后暂停", "idle": "未开始", "starting": "启动中", "empty": "空" } },
      "pack": { "label": "当前任务", "options": { "single": "单段视频", "long": "长视频创作包" } },
      "attention": { "label": "需要处理", "options": { "some": "有失败 / 取消", "none": "无" } }
    }
  </script>
  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="design-system/ds.js"></script>
  <script src="app/queue.js"></script>
  <script src="app/app.js"></script>
  <script>
    document.querySelectorAll("[data-proxy]").forEach((button) => button.addEventListener("click", () => document.getElementById(button.dataset.proxy).click()));
  </script>
</body>
</html>
