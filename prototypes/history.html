<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>历史 · Local Video Studio 原型</title>
  <script src="app/boot.js"></script>
  <link rel="stylesheet" href="design-system/tokens.css">
  <link rel="stylesheet" href="design-system/controls.css">
  <link rel="stylesheet" href="design-system/surfaces.css">
  <link rel="stylesheet" href="app/app.css">
  <link rel="stylesheet" href="app/history.css">
</head>
<body data-page="history">
  <div class="app-shell">
    <header data-shell></header>
    <main>
      <div class="history-heading page-heading sticky" style="display:grid">
          <div class="history-title"><h1>历史作品</h1><span class="caption num" id="history-count">137 个视频</span></div>
          <div class="seg lg" id="history-kind"><button type="button" data-value="video" aria-pressed="true"><i data-lucide="film"></i>视频</button><button type="button" data-value="image" aria-pressed="false"><i data-lucide="image"></i>图片</button></div>
          <div class="history-tools">
            <button class="btn btn-icon btn-gray filter-toggle" type="button" id="filter-toggle" aria-pressed="true" aria-controls="filter-lane" aria-label="筛选" data-tip="筛选"><i data-lucide="sliders-horizontal"></i><span class="filter-badge num" id="filter-badge" hidden></span></button>
            <div class="seg" id="history-layout"><button type="button" aria-pressed="true"><i data-lucide="columns-3"></i>瀑布流</button><button type="button" aria-pressed="false"><i data-lucide="layout-grid"></i>相册</button></div>
          </div>
        </div>
        <div class="context-bar" id="context-bar">
          <div class="lane filter-lane" id="filter-lane" role="region" aria-label="筛选">
            <div class="filter-row">
              <div class="fgroup"><span class="flabel">排序</span><select id="f-sort" data-size="sm" aria-label="排序"><option selected>最新优先</option><option>最早优先</option><option>评分从高到低</option><option>评分从低到高</option><option data-kind="video">时长从长到短</option><option data-kind="video">时长从短到长</option></select></div>
              <span class="fsep"></span>
              <button class="ftoggle" type="button" id="f-fav" aria-pressed="true"><i data-lucide="heart"></i>只看收藏</button>
              <div class="fgroup"><span class="flabel">评分</span><div class="dual-range" id="f-rating"><input type="range" min="0" max="10" step="1" value="6" aria-label="最低评分"><input type="range" min="0" max="10" step="1" value="10" aria-label="最高评分"></div><span class="fvalue num" id="f-rating-value"></span></div>
              <div class="fgroup" data-kind="video"><span class="flabel">最短时长</span><div class="range-wrap mini" id="f-dur-wrap"><input type="range" id="f-dur" min="0" max="7" step="1" value="0" aria-label="最短时长"></div><span class="fvalue num" id="f-dur-value"></span></div>
              <div class="fgroup"><span class="flabel">模型</span><span class="menu-anchor"><button class="fdrop fmodel" type="button" id="model-trigger" data-menu-trigger aria-expanded="false" aria-haspopup="dialog"><span class="fdrop-value" id="model-value"></span><i data-lucide="chevrons-up-down"></i></button>
                <div class="menu popover model-picker" role="dialog" aria-label="选择模型">
                  <div class="picker-head"><span class="caption" id="model-picked"></span><span class="spacer"></span><button class="btn btn-plain btn-sm" type="button" id="model-clear">全部模型</button></div>
                  <div class="model-list" id="model-list"></div>
                </div></span></div>
              <div class="fgroup"><span class="flabel">标签</span><span class="menu-anchor"><button class="fdrop ftag-drop" type="button" id="tag-browse" data-menu-trigger aria-expanded="false" aria-haspopup="dialog"><span class="fdrop-value" id="tag-value"></span><i data-lucide="chevrons-up-down"></i></button>
                <div class="menu right popover tag-picker" role="dialog" aria-label="选择标签">
                  <div class="tag-picked" id="tag-picked-zone">
                    <div class="picker-head"><span class="caption num" id="tag-picked-count"></span><span class="spacer"></span><button class="btn btn-plain btn-sm" type="button" id="tag-clear"><i data-lucide="x"></i>全部清除</button></div>
                    <div class="tag-picked-list" id="tag-picked"></div>
                  </div>
                  <div class="tag-search"><i data-lucide="search"></i><input id="tag-search" placeholder="搜索标签" aria-label="搜索标签" autocomplete="off"></div>
                  <div class="tag-pick-list" id="tag-list" role="listbox" aria-label="标签"></div>
                  <div class="tag-picker-foot caption"><span><span class="kbd">↵</span>包含</span><span><span class="kbd">⇧</span><span class="kbd">↵</span>排除</span><span><span class="kbd">↑↓</span>选择</span></div>
                </div></span></div>
              <span class="spacer"></span>
              <button class="btn btn-plain btn-sm" type="button" id="lane-clear"><i data-lucide="rotate-ccw"></i>清除全部</button>
              <span class="fsep"></span>
              <button class="ftoggle batch" type="button" id="batch-toggle" aria-pressed="false"><i data-lucide="square-check"></i>批量管理</button>
            </div>
          </div>
          <div class="lane batch-lane" id="batch-bar" hidden role="toolbar" aria-label="批量管理">
            <span class="batch-mode"><i data-lucide="square-check"></i>批量管理</span><button class="btn btn-plain btn-sm" type="button" id="batch-all"><i data-lucide="square"></i>全选</button><span class="meta num" id="batch-count">已选 0 / 8</span><span class="spacer"></span>
            <button class="btn btn-plain btn-sm" type="button" id="batch-copy" data-batch-action><i data-lucide="copy"></i>复制文件</button><button class="btn btn-plain btn-sm" type="button" id="batch-tags" data-batch-action><i data-lucide="tag"></i>编辑标签</button><button class="btn btn-destructive btn-sm" type="button" id="batch-delete" data-batch-action><i data-lucide="trash-2"></i>删除</button><button class="btn btn-icon btn-sm" type="button" id="batch-exit" aria-label="退出批量" data-tip="退出批量"><i data-lucide="x"></i></button>
          </div>
        </div>
        <div class="history-stage">
          <div class="history-gallery masonry lit-group" id="history-grid"></div>
          <aside class="scrubber" id="scrubber" aria-label="时间轴" hidden><div class="ts-track" id="ts-track"><span class="ts-rail"></span><div class="ts-marks" id="ts-marks"></div><span class="ts-hover" id="ts-hover" aria-hidden="true"><span></span></span><button class="ts-thumb" id="ts-thumb" type="button" role="slider" aria-orientation="vertical" aria-label="时间轴" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></button><div class="ts-bubble" id="ts-bubble" aria-hidden="true"><b></b><span></span></div></div></aside>
        </div>
      <div class="card" id="history-empty" hidden><div class="state"><i data-lucide="images"></i><h4 id="empty-title">还没有作品</h4><p>完成的生成会出现在这里。</p><a class="btn btn-gray" href="create.html"><i data-lucide="plus"></i>去创建</a></div></div>
    </main>
  </div>
  <div class="dialog-backdrop" id="batch-tags-dialog" hidden>
    <section class="dialog batch-tags" role="dialog" aria-modal="true" aria-labelledby="batch-tags-title">
      <div class="dialog-head"><span class="dialog-icon accent"><i data-lucide="tag"></i></span><div><h3 id="batch-tags-title">编辑标签</h3><span class="caption num" id="batch-tags-sub"></span></div><button class="btn btn-icon btn-sm" type="button" data-close aria-label="关闭"><i data-lucide="x"></i></button></div>
      <div class="bt-section">
        <div class="bt-head"><span>共同标签</span></div>
        <div class="bt-chips" id="bt-common"></div>
      </div>
      <div class="bt-section" id="bt-partial-zone">
        <div class="bt-head"><span>部分项目已有</span></div>
        <div class="bt-chips" id="bt-partial"></div>
      </div>
      <div class="bt-add">
        <div class="tag-search"><i data-lucide="plus"></i><input id="bt-input" placeholder="添加到全部所选项目，回车确认" aria-label="添加标签" autocomplete="off"></div>
        <div class="bt-chips" id="bt-suggest"></div>
      </div>
      <div class="dialog-actions"><span class="spacer"></span><button class="btn btn-primary lit" type="button" data-close data-autofocus>完成</button></div>
    </section>
  </div>
  <div class="dialog-backdrop" id="batch-delete-dialog" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="batch-delete-title">
      <div class="dialog-head"><span class="dialog-icon danger"><i data-lucide="trash-2"></i></span><div><h3 id="batch-delete-title"></h3><span class="caption" id="batch-delete-names"></span></div><button class="btn btn-icon btn-sm" type="button" data-close aria-label="关闭"><i data-lucide="x"></i></button></div>
      <div class="bd-thumbs" id="batch-delete-thumbs"></div>
      <p class="meta" id="batch-delete-note"></p>
      <div class="dialog-actions"><button class="btn btn-plain" type="button" data-close data-autofocus>取消</button><span class="spacer"></span><button class="btn btn-destructive-filled btn-destructive" type="button" id="batch-delete-confirm"><i data-lucide="trash-2"></i><span></span></button></div>
    </section>
  </div>
  <script id="proto-states" type="application/json">
    { "data": { "label": "数据", "options": { "normal": "有作品", "empty": "空" } } }
  </script>
  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="design-system/ds.js"></script>
  <script src="app/history.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
